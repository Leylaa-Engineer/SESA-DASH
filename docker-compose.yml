services:
  postgres:
    image: postgres:16-alpine
    container_name: sesa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sesa
      POSTGRES_USER: sesa
      POSTGRES_PASSWORD: sesa
    ports:
      - "5432:5432"
    volumes:
      - sesa_pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  sesa_pgdata:
